name: Acquire official LABINS Tom Street MrSID originals, cell 648138
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_labins_historical_images.py'
      - '.github/workflows/acquire-labins-historical-images.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  year-originals:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        year: [2007, 2010, 2013, 2016, 2019]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install source downloader
        run: python -m pip install requests==2.32.5
      - name: Syntax check
        run: python -m py_compile tools/acquire_labins_historical_images.py
      - name: Download byte-exact original MrSID and source sidecars
        run: python tools/acquire_labins_historical_images.py --year "${{ matrix.year }}"
      - name: Check every saved source checksum
        env:
          SOURCE_YEAR: "${{ matrix.year }}"
        run: |
          python - <<'PY'
          import json,pathlib,hashlib,os
          yr=os.environ["SOURCE_YEAR"]
          root=pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/ORIGINAL_IMAGERY_CELL_648138")
          j=json.loads((root/f"ACQUISITION_MANIFEST_{yr}.json").read_text())
          assert len(j["files"])==j["published_file_count"]
          for x in j["files"]:
            if x["status"].startswith("ORIGINAL_"):
              raw=pathlib.Path(x["path"]).read_bytes()
              assert len(raw)==x["bytes"] and hashlib.sha256(raw).hexdigest()==x["sha256"]
              if x["name"].endswith(".sid"): assert raw[:4].lower()==b"msid"
          print("Verified",j["archived_file_count"],"originals for",yr)
          PY
      - name: Commit captured originals to main, preserving source history
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/ORIGINAL_IMAGERY_CELL_648138/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: LABINS ${{ matrix.year }} original aerial and worldfiles cell 648138 [skip ci]"
          for n in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep 7
          done
          exit 1
