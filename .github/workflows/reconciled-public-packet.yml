name: Build reconciled public draft PDFs

on:
  push:
    branches: [main]
    paths:
      - '15_RECONCILED_DRAFTS/*.md'
      - 'PUBLIC_EVIDENCE_GUIDE.md'
      - 'NEIGHBOR_REVIEW_GUIDE.md'
      - '00_CONTROL/DOCUMENT_STATUS_AND_NEIGHBOR_REVIEW_2026-10-16.md'
      - 'tools/autonomous_evidence_pipeline.py'
      - 'PUBLICATION_AND_VERSIONING.md'
      - '18_NEIGHBOR_TOOLKIT/**'
      - 'tools/check_neighbor_release.py'
      - 'tools/reviewed_question_report.md'
      - '00_CONTROL/OPEN_QUESTIONS.md'
      - '00_CONTROL/READING_ORDER_AND_SNAPSHOT_STATUS.md'
      - '17_CURRENT_RESEARCH/FIVE_QUESTION_FINDINGS_2026-10-16.md'
      - 'tools/build_reconciled_packet.py'
      - 'tools/verify_reconciled_release.py'
      - 'tools/check_document_claims.py'
      - 'tools/check_repository_consistency.py'
      - '00_CONTROL/ACTIVE_ASSERTION_CONSISTENCY_2026-10-15.md'
      - 'tools/check_jurisdiction_scope.py'
      - '00_CONTROL/JURISDICTION_AND_AUTHORITY_SCOPE_2026-10-15.md'
      - 'README.md'
      - '02_PROPERTY_AND_PARCELS/*.md'
      - '03_PERMITS_AND_INSPECTIONS/**/DOCUMENT_COMPLETENESS.md'
      - '13_PUBLIC_RECORDS_REQUESTS/*.md'
      - '00_CONTROL/REGULATORY_AND_CASELAW_MATRIX.md'
      - '00_CONTROL/CONTRADICTION_LOG.csv'
      - '00_CONTROL/FINAL_REVIEW_READINESS_2026-10-15.md'
      - '00_CONTROL/FINAL_FILE_SCOPE_INVENTORY_2026-10-15.csv'
      - 'requirements-release.txt'
      - '00_CONTROL/EVIDENCE_LEDGER.csv'
      - '00_CONTROL/SOURCE_REGISTER.csv'
      - '00_CONTROL/PERMIT_DOCUMENT_INVENTORY.csv'
      - '00_CONTROL/CHRONOLOGY.csv'
      - '00_CONTROL/MISSING_RECORDS_AND_ACTIONS.csv'
      - '00_CONTROL/RECORDS_ACQUISITION_MATRIX.csv'
      - '00_CONTROL/tools/validate_evidence.py'
      - '00_CONTROL/tools/test_evidence.py'
      - '00_CONTROL/tools/strict_release_gate.py'
      - '00_CONTROL/tools/classify_for_release.py'
      - '00_CONTROL/CLAIM_SOURCE_LINKS.csv'
      - '00_CONTROL/EXHIBIT_INDEX.csv'
      - '.github/workflows/reconciled-public-packet.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: reconciled-public-packet-main
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Validate and render public-scope drafts
        run: |
          python -m py_compile tools/build_reconciled_packet.py
          python tools/build_reconciled_packet.py
          python 00_CONTROL/tools/validate_evidence.py
          python - <<'PY'
          import sys
          sys.path.insert(0, "00_CONTROL/tools")
          import test_evidence as checks
          for fn in (
              checks.t_manifest_no_self_hash,
              checks.t_unique_ids,
              checks.t_checksums_match,
              checks.t_release_zip_hash_parity,
              checks.t_no_submitted_without_receipt,
              checks.t_request_files_exist,
          ):
              fn()
          failed = [name for name, ok, _ in checks.RESULTS if not ok]
          if failed:
              raise SystemExit("Evidence invariant failures: " + ", ".join(failed))
          print(f"Evidence invariants: {len(checks.RESULTS)} checks PASS")
          PY
          python tools/verify_reconciled_release.py
          python tools/check_document_claims.py
          python tools/check_repository_consistency.py
          python tools/check_jurisdiction_scope.py
          python -B 00_CONTROL/tools/strict_release_gate.py
          python -B 00_CONTROL/tools/classify_for_release.py --write
          python -B 00_CONTROL/tools/classify_for_release.py --check
          python -B tools/check_neighbor_release.py
          python - <<'PY'
          import json, pathlib
          from pypdf import PdfReader
          r=pathlib.Path('15_RECONCILED_DRAFTS/pdf')
          m=json.loads((r/'RELEASE_MANIFEST.json').read_text())
          assert m['release_status']=='DRAFT_NOT_APPROVED_FOR_EXTERNAL_DISTRIBUTION'
          assert m['photo_originals_included'] is False
          assert len(m['outputs'])==6
          assert all(item['pages']>=1 for item in m['outputs'])
          assert len(PdfReader(str(r/'Tom_Street_Reconciled_Public_Meeting_Draft.pdf')).pages)==sum(item['pages'] for item in m['outputs'][:5])
          print('Public PDF QA: PASS')
          PY
      - name: Commit generated public PDFs to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 15_RECONCILED_DRAFTS/pdf/ 00_CONTROL/EVIDENCE_MANIFEST.csv 00_CONTROL/RELEASE_PRIVACY_CLASSIFICATION.csv
          if git diff --cached --quiet; then
            echo "No new generated files"
            exit 0
          fi
          git commit -m "docs: rebuild reconciled public draft PDF bundle [skip ci]"
          git push origin HEAD:main
