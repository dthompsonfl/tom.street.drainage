name: Archived five-question workflow (read-only)

# This historical automation previously reapplied an old, pinned Actions artifact
# and replaced newer homeowner-facing text. Keep the workflow as a traceable
# compatibility marker, but never replay that old artifact or write to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-note:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain the superseded research workflow
        run: |
          echo 'The historical reviewed-artifact replay is retired.'
          echo 'Use 17_CURRENT_RESEARCH/FIVE_QUESTION_FINDINGS_2026-10-16.md for the preserved report.'
          echo 'Use the current homeowner packet sources in 15_RECONCILED_DRAFTS.'
          test -f 17_CURRENT_RESEARCH/FIVE_QUESTION_FINDINGS_2026-10-16.md
          test -f PUBLIC_EVIDENCE_GUIDE.md
