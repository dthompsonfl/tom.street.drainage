name: Validate aerial mosaic historical source provenance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: archive-tom-street-fdep-aerial-catalog
  cancel-in-progress: false
jobs:
  inspect-source-mosaics:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify acquisition source syntax
        run: python -m py_compile tools/acquire_fdep_aerial_mosaic_provenance.py
      - name: Query official aerial mosaic footprints and source metadata
        id: probe
        continue-on-error: true
        run: python tools/acquire_fdep_aerial_mosaic_provenance.py
      - name: Check provenance response format
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/FLORIDA_DEP_HISTORICAL_AERIALS/MOSAIC_CATALOG_PROVENANCE.json")
          d = json.loads(p.read_text())
          assert len(d["records"]) == d["services_queried"]
          print("Catalog point responses", d["catalog_features_found"], "/", d["services_queried"])
          PY
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-audit-fdep-aerial-provenance-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/FLORIDA_DEP_HISTORICAL_AERIALS/MOSAIC_CATALOG_PROVENANCE.json
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
