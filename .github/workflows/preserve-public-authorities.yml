name: Preserve verified public legal source PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_public_primary_sources.py'
      - '.github/workflows/preserve-public-authorities.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-public-authorities-main
  cancel-in-progress: false

jobs:
  archive-authorities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install pypdf==5.9.0
      - name: Download and independently validate public official PDFs
        run: python tools/acquire_public_primary_sources.py
      - name: Commit only allowlisted public PDFs and acquisition manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 08_LEGAL_AND_REGULATORY/SOURCE/PRIMARY_AUTHORITY/
          if git diff --cached --quiet; then
            echo "Official PDFs already archived; no changes"
          else
            git commit -m "docs(source): preserve reviewed court opinion and DEP index PDFs [skip ci]"
            git push origin HEAD:main
          fi
      - name: Report exactly what was acquired
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('08_LEGAL_AND_REGULATORY/SOURCE/PRIMARY_AUTHORITY/ACQUISITION_MANIFEST.json')
          m=json.loads(p.read_text())
          print('Archived:', [(x['file'],x['status'],x.get('bytes')) for x in m['sources']])
          print('Full signed DEP orders obtained:', m['final_orders_signed_pdf_obtained'])
          if not m['all_public_pdfs_captured']:
            print('Some official files could not be downloaded; see manifest. No missing documents were fabricated.')
            sys.exit(1)
          PY
