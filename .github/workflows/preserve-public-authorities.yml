name: Preserve verified public legal source PDFs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: preserve-public-authorities-main
  cancel-in-progress: false

jobs:
  archive-authorities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PDF parser
        run: python -m pip install pypdf==5.9.0
      - name: Download and independently validate public official PDFs
        run: python tools/acquire_public_primary_sources.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Report exactly what was acquired
        run: |
          python - <<'PY'
          import json, pathlib, sys
          p=pathlib.Path('08_LEGAL_AND_REGULATORY/SOURCE/PRIMARY_AUTHORITY/ACQUISITION_MANIFEST.json')
          m=json.loads(p.read_text())
          print('Archived:', [(x['file'],x['status'],x.get('bytes')) for x in m['sources']])
          print('Full signed DEP orders obtained:', m['final_orders_signed_pdf_obtained'])
          if not m['all_public_pdfs_captured']:
            print('Some official files could not be downloaded; see manifest. No missing documents were fabricated.')
            sys.exit(1)
          PY
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-preserve-public-authorities-${{ github.sha }}
          path: |
            08_LEGAL_AND_REGULATORY/SOURCE/PRIMARY_AUTHORITY/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
