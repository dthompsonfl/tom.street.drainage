name: Preserve County historic stormwater GIS provenance
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_county_stormwater_provenance.py'
      - '.github/workflows/acquire-county-stormwater-provenance.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acquire-county-stormwater-provenance
  cancel-in-progress: false
jobs:
  preserve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing evidence dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Check acquisition code syntax
        run: python -m py_compile tools/acquire_county_stormwater_provenance.py
      - name: Acquire and verify original County GIS responses
        run: python tools/acquire_county_stormwater_provenance.py
      - name: Refresh source-byte evidence manifest
        run: python 00_CONTROL/tools/validate_evidence.py
      - name: Commit verified public originals
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_STORMWATER_PROVENANCE/ 00_CONTROL/EVIDENCE_MANIFEST.csv
          if git diff --cached --quiet; then
            echo "No new source bytes"
            exit 0
          fi
          git commit -m "evidence: preserve County GIS stormwater provenance [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
