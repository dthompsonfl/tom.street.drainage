name: Preserve County historic stormwater GIS provenance
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-county-stormwater-provenance
  cancel-in-progress: false
jobs:
  preserve-source:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing evidence dependencies
        run: python -m pip install -r requirements-release.txt
      - name: Check acquisition code syntax
        run: python -m py_compile tools/acquire_county_stormwater_provenance.py
      - name: Acquire and verify original County GIS responses
        run: python tools/acquire_county_stormwater_provenance.py
      - name: Refresh source-byte evidence manifest
        run: python 00_CONTROL/tools/validate_evidence.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-county-stormwater-provenance-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_STORMWATER_PROVENANCE/
            00_CONTROL/EVIDENCE_MANIFEST.csv
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
