name: Resolve Tom Street LABINS State Plane North grid IDs
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_labins_north_grid_point.py'
      - '.github/workflows/acquire-labins-north-grid-point.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: tom-street-labins-north-grid-geometry
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/acquire_labins_north_grid_point.py
      - name: Query the official LABINS State Plane North grid feature service
        run: python tools/acquire_labins_north_grid_point.py
      - name: Verify all source hashes and preserve truthful failures
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,hashlib
          root=Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA")
          m=json.loads((root/"LABINS_NORTH_GRID_POINT_LOOKUP_MANIFEST.json").read_text())
          assert len(m["captures"])==6
          assert "not an aerial photograph" in m["limitations"][0].lower()
          for r in m["captures"]:
              if r["status"].startswith("OFFICIAL_"):
                  b=Path(r["path"]).read_bytes()
                  assert len(b)==r["bytes"] and hashlib.sha256(b).hexdigest()==r["sha256"]
          print("Official source captures integrity verified; grid status:",m["status"])
          PY
      - name: Preserve original public geometry with full source URLs and limits
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: preserve official LABINS north imagery grid intersections [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
