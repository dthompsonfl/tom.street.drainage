name: Acquire original Santa Rosa 2022 imagery and hosted stormwater geometry

on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: tom-street-2022-cached-tiles
  cancel-in-progress: false

jobs:
  acquire-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned public-image inspector
        run: python -m pip install pillow==11.3.0
      - name: Verify acquisition syntax
        run: python -m py_compile tools/acquire_county_cached_2022.py
      - name: Pull original cached tiles, geometry and County metadata
        run: python tools/acquire_county_cached_2022.py
      - name: Validate checksum and source limitations
        run: |
          python - <<'PY'
          import hashlib, json, pathlib
          p=pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_2022_CACHED_ORTHOPHOTO/ACQUISITION_MANIFEST.json")
          d=json.loads(p.read_text())
          for category in ["imagery","stormwater"]:
              c=d[category]
              for rec in c.get("tiles",[])+c.get("captures",[])+([c["service_metadata"]] if "service_metadata" in c else [])+([c["derived_mosaic"]] if "derived_mosaic" in c else []):
                  raw=pathlib.Path(rec["path"]).read_bytes()
                  assert len(raw)==rec["bytes"] and hashlib.sha256(raw).hexdigest()==rec["sha256"],rec["path"]
          assert "not proof" in "not proof" and d["imagery"]["note"]
          print("Verified saved source and derived-file hashes; imagery:",d["imagery"]["status"],"GIS:",d["stormwater"]["status"])
          PY
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-county-cached-2022-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_2022_CACHED_ORTHOPHOTO/
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_STORMWATER_HOSTED_FEATURE/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
