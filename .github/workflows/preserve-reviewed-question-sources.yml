name: Preserve independently reviewed question sources
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
concurrency:
  group: preserve-reviewed-question-sources
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve exact already-reviewed artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api repos/dthompsonfl/tom.street.drainage/actions/artifacts/12027603047/zip > /tmp/reviewed-sources.zip
      - name: Verify whole artifact and preserve only approved original JSON
        run: python tools/import_reviewed_question_sources.py /tmp/reviewed-sources.zip
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-preserve-reviewed-question-sources-${{ github.sha }}
          path: |
            17_CURRENT_RESEARCH/captures/20261016T054716Z/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
