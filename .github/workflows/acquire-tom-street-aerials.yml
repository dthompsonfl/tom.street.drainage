name: Preserve Santa Rosa historical aerial views
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-santa-rosa-tom-street-aerials
  cancel-in-progress: false
jobs:
  preserve-imagery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m py_compile tools/acquire_tom_street_historical_aerials.py
      - name: Install pinned image validator
        run: python -m pip install pillow==11.3.0
      - name: Capture and independently validate public County aerial images
        run: python tools/acquire_tom_street_historical_aerials.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Verify final recorded public image status
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/COUNTY_HISTORICAL_AERIAL_EXPORTS/ACQUISITION_MANIFEST.json")
          d = json.loads(p.read_text())
          print(d["status"], d["success_count"], "of", d["attempt_count"])
          for x in d["entries"]:
            print(x["service_year_label"], x["status"], x.get("sha256", ""), x.get("failure_details", ""))
          PY
