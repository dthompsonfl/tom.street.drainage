name: Acquire reviewed public Tom Street LiDAR tile
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-tom-street-noaa-2017
  cancel-in-progress: false
jobs:
  preserve-2017-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check safe acquisition script syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2017.py
      - name: Install fixed open-source raster parser
        run: python -m pip install rasterio==1.4.3
      - name: Obtain official NOAA bare-earth TIFF and check georeferencing
        run: python tools/acquire_noaa_tom_street_2017.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Print exact evidence status
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.acquisition.json")
          d = json.loads(p.read_text())
          print(d["status"], d["sha256"], d["bytes"], d["source_url"])
          PY
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-tom-street-lidar-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.tif
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.acquisition.json
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
