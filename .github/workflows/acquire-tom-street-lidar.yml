name: Acquire reviewed public Tom Street LiDAR tile
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_noaa_tom_street_2017.py'
      - '.github/workflows/acquire-tom-street-lidar.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acquire-tom-street-noaa-2017
  cancel-in-progress: false
jobs:
  preserve-2017-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check safe acquisition script syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2017.py
      - name: Install fixed open-source raster parser
        run: python -m pip install rasterio==1.4.3
      - name: Obtain official NOAA bare-earth TIFF and check georeferencing
        run: python tools/acquire_noaa_tom_street_2017.py
      - name: Commit only official public raster and manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.tif
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.acquisition.json
          if git diff --cached --quiet; then
            echo "NOAA bytes and manifest already preserved; no changes"
          else
            git commit -m "evidence: preserve and validate original 2017 NOAA lidar GeoTIFF [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
      - name: Print exact evidence status
        run: |
          python - <<'PY'
          import json, pathlib
          p = pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2017/16reu175645.acquisition.json")
          d = json.loads(p.read_text())
          print(d["status"], d["sha256"], d["bytes"], d["source_url"])
          PY
