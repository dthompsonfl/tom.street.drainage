name: Capture official DEP stormwater and NWFWMD ERP public records
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_fdep_nwfwmd_public_gis.py'
      - '.github/workflows/acquire-fdep-nwfwmd-public-gis.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tom-street-fdep-nwfwmd-2026-source-capture
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check syntax
        run: python -m py_compile tools/acquire_fdep_nwfwmd_public_gis.py
      - name: Retrieve official public agency source JSON
        run: python tools/acquire_fdep_nwfwmd_public_gis.py
      - name: Verify saved original source bytes and preserved limitations
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          p=pathlib.Path("09_ENVIRONMENTAL_PERMITS/PRE_REQUEST_PUBLIC_PERMIT_REFRESH_2026-10-16/ACQUISITION_MANIFEST.json")
          j=json.loads(p.read_text())
          assert len(j["sources"])==4 and len(j["conclusion_limitations"])>=4
          for s in j["sources"]:
            if s["status"].startswith("ORIGINAL_OFFICIAL"):
              b=pathlib.Path(s["path"]).read_bytes()
              assert len(b)==s["bytes"] and hashlib.sha256(b).hexdigest()==s["sha256"]
          print("PASS public GIS original-byte integrity; no permit applicability assertion")
          PY
      - name: Commit original public primary captures without force
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 09_ENVIRONMENTAL_PERMITS/PRE_REQUEST_PUBLIC_PERMIT_REFRESH_2026-10-16/
          if git diff --cached --quiet; then echo "No source changes"; exit 0;fi
          git commit -m "evidence: preserve FDEP stormwater and NWFWMD permit source queries [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
