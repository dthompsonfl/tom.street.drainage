name: Preserve original 2018 USGS Panhandle bare-earth DEM
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-noaa-tom-street-2018
  cancel-in-progress: false
jobs:
  acquire-source:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check acquisition script syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2018.py
      - name: Install fixed geospatial source validators
        run: python -m pip install rasterio==1.4.3 fiona==1.10.1 shapely==2.0.7 pyproj==3.7.1
      - name: Acquire NOAA 2018 geospatial index and only matched original DEM
        id: attempt
        continue-on-error: true
        run: python tools/acquire_noaa_tom_street_2018.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Report actual downloaded evidence status
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2018/ACQUISITION_MANIFEST.json')
          o=json.loads(p.read_text())
          print('2018 DEM status:', o['status'], 'error:', o.get('error', 'none'))
          PY
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-tom-street-2018-lidar-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2018/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
