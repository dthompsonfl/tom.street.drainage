name: Preserve original 2006 Tom Street NOAA point cloud
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-tom-street-noaa-2006-pointcloud
  cancel-in-progress: false
jobs:
  preserve-2006-public-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2006_laz.py
      - name: Download NOAA 2006 source based on three verified tile intersects
        run: python tools/acquire_noaa_tom_street_2006_laz.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-tom-street-2006-pointcloud-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/20060228_sr1369_ld_p17.copc.laz
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/2006_tom_street_copc_acquisition.json
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
