name: Preserve original 2006 Tom Street NOAA point cloud
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-tom-street-noaa-2006-pointcloud
  cancel-in-progress: false
jobs:
  preserve-2006-public-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2006_laz.py
      - name: Download NOAA 2006 source based on three verified tile intersects
        run: python tools/acquire_noaa_tom_street_2006_laz.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
