name: Preserve original 2006 Tom Street NOAA point cloud
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_noaa_tom_street_2006_laz.py'
      - '.github/workflows/acquire-tom-street-2006-pointcloud.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acquire-tom-street-noaa-2006-pointcloud
  cancel-in-progress: false
jobs:
  preserve-2006-public-tile:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check source syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2006_laz.py
      - name: Download NOAA 2006 source based on three verified tile intersects
        run: python tools/acquire_noaa_tom_street_2006_laz.py
      - name: Commit allowlisted public original and checked manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/20060228_sr1369_ld_p17.copc.laz
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/2006_tom_street_copc_acquisition.json
          if git diff --cached --quiet; then
            echo "Original 2006 point cloud already preserved"
          else
            git commit -m "evidence: preserve NOAA 2006 Tom Street original LiDAR cloud [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
