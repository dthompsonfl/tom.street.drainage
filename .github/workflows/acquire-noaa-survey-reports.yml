name: Preserve original NOAA lidar survey QA reports
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_noaa_survey_reports.py'
      - '.github/workflows/acquire-noaa-survey-reports.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: preserve-noaa-survey-qa-docs
  cancel-in-progress: false
jobs:
  archive-documents:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate source syntax
        run: python -m py_compile tools/acquire_noaa_survey_reports.py
      - name: Install fixed PDF parser
        run: python -m pip install pypdf==5.9.0
      - name: Acquire originals and record exact failures
        id: attempt
        continue-on-error: true
        run: python tools/acquire_noaa_survey_reports.py
      - name: Check JSON and preserved file sizes
        run: |
          python - <<'PY'
          import json, pathlib
          p=pathlib.Path('11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/NOAA_SURVEY_REPORTS/ACQUISITION_MANIFEST.json')
          d=json.loads(p.read_text())
          assert len(d['records']) == d['requested_count']
          for rec in d['records']:
              if rec['status'].startswith('ORIGINAL_'):
                  f=pathlib.Path(rec['file'])
                  assert f.exists() and f.stat().st_size == rec['bytes']
          print(d['retrieved_count'], 'reports preserved')
          PY
      - name: Commit only official source documents and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/NOAA_SURVEY_REPORTS/
          if git diff --cached --quiet; then
            echo "No new official documents"
          else
            git commit -m "evidence: preserve NOAA historical survey quality control reports [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
