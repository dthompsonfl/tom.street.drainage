name: Archive official East Navarre watershed study map
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_east_navarre_official_study_map.py'
      - '.github/workflows/acquire-east-navarre-map.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: east-navarre-official-study-image
  cancel-in-progress: false
jobs:
  preserve-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/acquire_east_navarre_official_study_map.py
      - name: Install pinned JPEG parser
        run: python -m pip install pillow==11.3.0
      - name: Preserve original official County study-area JPEG and checksum
        run: python tools/acquire_east_navarre_official_study_map.py
      - name: Commit only approved public study-area source and metadata
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/East_Navarre_Watershed_Study_Area_Official.jpg
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/East_Navarre_Watershed_Study_Area_Official.acquisition.json
          if git diff --cached --quiet; then
            echo "Official map already archived"
          else
            git commit -m "evidence: preserve official East Navarre study-area map [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
