name: Archive official East Navarre watershed study map
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: east-navarre-official-study-image
  cancel-in-progress: false
jobs:
  preserve-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/acquire_east_navarre_official_study_map.py
      - name: Install pinned JPEG parser
        run: python -m pip install pillow==11.3.0
      - name: Preserve original official County study-area JPEG and checksum
        run: python tools/acquire_east_navarre_official_study_map.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-east-navarre-map-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/East_Navarre_Watershed_Study_Area_Official.jpg
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/East_Navarre_Watershed_Study_Area_Official.acquisition.json
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
