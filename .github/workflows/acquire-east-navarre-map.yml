name: Archive official East Navarre watershed study map
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: east-navarre-official-study-image
  cancel-in-progress: false
jobs:
  preserve-map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax check
        run: python -m py_compile tools/acquire_east_navarre_official_study_map.py
      - name: Install pinned JPEG parser
        run: python -m pip install pillow==11.3.0
      - name: Preserve original official County study-area JPEG and checksum
        run: python tools/acquire_east_navarre_official_study_map.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
