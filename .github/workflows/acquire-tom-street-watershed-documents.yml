name: Acquire County public watershed reports
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_public_tom_street_watershed_pdfs.py'
      - '.github/workflows/acquire-tom-street-watershed-documents.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acquire-santa-rosa-watershed-public-pdfs
  cancel-in-progress: false
jobs:
  archive-public-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify acquisition script syntax
        run: python -m py_compile tools/acquire_public_tom_street_watershed_pdfs.py
      - name: Install PDF structural validator
        run: python -m pip install pypdf==5.9.0
      - name: Acquire primary Santa Rosa County watershed PDF sources
        run: python tools/acquire_public_tom_street_watershed_pdfs.py
      - name: Commit allowlisted published PDFs and provenance
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/
          if git diff --cached --quiet; then
            echo "Public watershed sources unchanged"
          else
            git commit -m "evidence: preserve published Santa Rosa watershed source documents [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
