name: Acquire County public watershed reports
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-santa-rosa-watershed-public-pdfs
  cancel-in-progress: false
jobs:
  archive-public-pdfs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify acquisition script syntax
        run: python -m py_compile tools/acquire_public_tom_street_watershed_pdfs.py
      - name: Install PDF structural validator
        run: python -m pip install pypdf==5.9.0
      - name: Acquire primary Santa Rosa County watershed PDF sources
        run: python tools/acquire_public_tom_street_watershed_pdfs.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-tom-street-watershed-documents-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/WATERSHED_DOCUMENTS/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
