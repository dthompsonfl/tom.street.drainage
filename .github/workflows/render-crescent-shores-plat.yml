name: Render original Crescent Shores recorded plat for human review
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: crescent-shores-plat-display-derivatives
  cancel-in-progress: false
jobs:
  render-and-preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned PDF renderer
        run: python -m pip install pymupdf==1.26.4 pillow==11.3.0
      - name: Validate source script syntax
        run: python -m py_compile tools/render_crescent_shores_plat.py
      - name: Confirm official index and original PDF source bytes then render pages
        run: python tools/render_crescent_shores_plat.py
      - name: Verify derivative file hashes and page count
        run: |
          python - <<'PY'
          import hashlib,json,pathlib
          p=pathlib.Path("02_PROPERTY_AND_PARCELS/PRE_REQUEST_OCT16_PRIMARY_LOOKUPS/PLAT_A_70_DISPLAY_DERIVATIVES/INSPECTION_AND_RENDER_MANIFEST.json")
          d=json.loads(p.read_text())
          assert len(d["records"])==2
          for r in d["records"]:
            b=pathlib.Path(r["preview"]).read_bytes()
            assert b.startswith(b"\xff\xd8\xff")
            assert len(b)==r["preview_bytes"]
            assert hashlib.sha256(b).hexdigest()==r["preview_sha256"]
          print("PASS two original-linked recorded-plat derivatives")
          PY
      - name: Report generated plat image status without publishing
        run: |
          git status --short
          echo "Derived plat renders are not evidence of a modern lot survey and require review."
