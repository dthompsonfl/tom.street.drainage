name: Acquire original 2006 NOAA LiDAR tile index
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_noaa_tom_street_2006_index.py'
      - '.github/workflows/acquire-tom-street-2006-lidar-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: acquire-tom-street-noaa-2006-index
  cancel-in-progress: false
jobs:
  preserve-source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2006_index.py
      - name: Install pinned geospatial libraries
        run: python -m pip install fiona==1.10.1 shapely==2.0.7 pyproj==3.7.1
      - name: Acquire authoritative NOAA index and identify Tom Street intersecting tiles
        run: python tools/acquire_noaa_tom_street_2006_index.py
      - name: Commit only public index and selection manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/tileindex_2006_FL_Panhandle_m57.gpkg
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/tileindex_2006_FL_Panhandle_m57.acquisition.json
          if git diff --cached --quiet; then
            echo "Source and index selection already preserved"
          else
            git commit -m "evidence: preserve 2006 NOAA LiDAR tile index and provenance [skip ci]"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
