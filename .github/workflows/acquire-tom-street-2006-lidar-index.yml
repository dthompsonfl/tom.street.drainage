name: Acquire original 2006 NOAA LiDAR tile index
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: acquire-tom-street-noaa-2006-index
  cancel-in-progress: false
jobs:
  preserve-source-index:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Python syntax
        run: python -m py_compile tools/acquire_noaa_tom_street_2006_index.py
      - name: Install pinned geospatial libraries
        run: python -m pip install fiona==1.10.1 shapely==2.0.7 pyproj==3.7.1
      - name: Acquire authoritative NOAA index and identify Tom Street intersecting tiles
        run: python tools/acquire_noaa_tom_street_2006_index.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-tom-street-2006-lidar-index-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/tileindex_2006_FL_Panhandle_m57.gpkg
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/ORIGINAL_NOAA_2006/tileindex_2006_FL_Panhandle_m57.acquisition.json
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
