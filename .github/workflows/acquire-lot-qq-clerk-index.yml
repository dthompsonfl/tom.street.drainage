name: Discover Lot QQ Clerk instruments and Property Appraiser plat index
on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_lot_qq_clerk_index.py'
      - '.github/workflows/acquire-lot-qq-clerk-index.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tom-street-lot-qq-index-discovery
  cancel-in-progress: false
jobs:
  source-search:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-source search dependencies
        run: |
          python -m pip install requests==2.32.5 beautifulsoup4==4.14.2 playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Validate source syntax
        run: python -m py_compile tools/acquire_lot_qq_clerk_index.py
      - name: Search Clerk public guest index without retaining sensitive raw pages
        run: python tools/acquire_lot_qq_clerk_index.py
      - name: Verify derivation limitations and non-republication of deeds
        run: |
          python - <<'PY'
          import json,pathlib
          root=pathlib.Path("02_PROPERTY_AND_PARCELS/CLERK_LOT_QQ_DISCOVERY_2026-10-17")
          files=sorted(root.glob("INDEX_DISCOVERY_REPORT*.json"))
          assert files
          x=json.loads(files[-1].read_text())
          assert len(x["searches"])==5
          assert "NOT_COMPLETE" in x["completeness"]
          assert all("relevant_index_rows" in z for z in x["searches"])
          print("PASS candidate index metadata, no claim of deed completion.")
          PY
      - name: Preserve only index metadata and search limitations
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 02_PROPERTY_AND_PARCELS/CLERK_LOT_QQ_DISCOVERY_2026-10-17/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: retain bounded public Lot QQ Clerk search index [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
