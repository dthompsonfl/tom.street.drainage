name: Preserve Santa Rosa LABINS aerial inventory and original grid map

on:
  push:
    branches: [main]
    paths:
      - 'tools/acquire_labins_santa_rosa.py'
      - '.github/workflows/acquire-labins-santa-rosa.yml'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: tom-street-labins-public-index
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded source verification dependencies
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2 pypdf==6.1.1
      - name: Validate script syntax
        run: python -m py_compile tools/acquire_labins_santa_rosa.py
      - name: Download official LABINS grid original and probe inventory
        run: python tools/acquire_labins_santa_rosa.py
      - name: Validate original PDF and manifest if acquired
        run: |
          python - <<'PY'
          import pathlib,hashlib,json
          p=pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/ACQUISITION_MANIFEST.json")
          m=json.loads(p.read_text())
          assert len(m["limitations"])>=4
          src=m["official_grid_index"]
          if src["status"]=="ORIGINAL_GRID_PDF_SAVED_AND_HASHED":
              raw=pathlib.Path(src["path"]).read_bytes()
              assert raw.startswith(b"%PDF-")
              assert len(raw)==src["bytes"] and hashlib.sha256(raw).hexdigest()==src["sha256"]
          print("LABINS public source acquisition explicitly scoped")
          PY
      - name: Preserve public source metadata and original grid if available
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: archive LABINS Santa Rosa aerial grid and inventory metadata [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
