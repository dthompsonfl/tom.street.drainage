name: Discover official LABINS cell 648138 aerial downloads
on:
  push:
    branches: [main]
    paths:
      - 'tools/discover_labins_hires_cell.py'
      - '.github/workflows/discover-labins-hire-cell.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: tom-street-labins-cell-648138
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public HTML source parser
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.14.2
      - name: Syntax verification
        run: python -m py_compile tools/discover_labins_hires_cell.py
      - name: Submit exact verified cell to LABINS image archive
        run: python tools/discover_labins_hires_cell.py
      - name: Verify unchanged official source bytes
        run: |
          python - <<'PY'
          import pathlib,json,hashlib
          p=pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/LABINS_648138_IMAGE_DOWNLOAD_DISCOVERY_MANIFEST.json")
          j=json.loads(p.read_text())
          assert j["exact_verified_grid_id"]=="648138"
          assert j["limits"]
          docs=list(j["source_documents"])+[x["source_capture"] for x in j["search_results"] if "source_capture" in x]
          for d in docs:
              b=pathlib.Path(d["path"]).read_bytes()
              assert len(b)==d["bytes"] and hashlib.sha256(b).hexdigest()==d["sha256"]
          print("Official source bytes and acquisition limitations checked")
          PY
      - name: Preserve bounded public source pages and discovery manifest
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-17/LABINS_SANTA_ROSA/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "evidence: preserve LABINS grid 648138 aerial-availability lookup [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
