name: Preserve FDOT historical aerial imagery index
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: preserve-fdot-historical-index
  cancel-in-progress: false
jobs:
  preserve:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check script syntax
        run: python -m py_compile tools/acquire_fdot_aerial_index.py
      - name: Install stable PDF reader
        run: python -m pip install pypdf==5.9.0
      - name: Download original FDOT year-availability and latest photo indexes
        id: attempt
        continue-on-error: true
        run: python tools/acquire_fdot_aerial_index.py
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-fdot-aerial-index-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/FDOT_AERIAL_ARCHIVE_INDEX/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
