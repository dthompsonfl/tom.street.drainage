name: Acquire federal 2023 USDA Tom Street aerial imagery
on:
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: archive-naip2023-tom-street
  cancel-in-progress: false
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check acquisition script
        run: python -m py_compile tools/acquire_usda_naip_2023_tom_street.py
      - name: Install fixed JPEG parser
        run: python -m pip install pillow==11.3.0
      - name: Download and validate 2023 USDA NAIP image and mosaic metadata
        id: attempt
        continue-on-error: true
        run: python tools/acquire_usda_naip_2023_tom_street.py
      - name: Validate public image manifest
        run: |
          python - <<'PY'
          import json, pathlib, hashlib
          p=pathlib.Path("11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/USDA_NAIP_2023/ACQUISITION_MANIFEST.json")
          d=json.loads(p.read_text())
          if d["image_status"].startswith("PUBLIC_"):
            f=pathlib.Path(d["path"])
            assert f.stat().st_size==d["bytes"]
            assert hashlib.sha256(f.read_bytes()).hexdigest()==d["sha256"]
          print(d["image_status"],d["catalog_status"],d.get("image_failure"))
          PY
      - name: Report source capture for controlled integration
        if: always()
        run: |
          git status --short
          echo "Unreviewed acquired sources are not automatically committed or publicly republished."
      - name: Screen for unsafe captures before creating a review-only artifact
        run: python -B 00_CONTROL/tools/classify_for_release.py --check
      - name: Retain acquired public-source candidates for manual review (never auto-publish)
        uses: actions/upload-artifact@v4
        with:
          name: unapproved-source-capture-acquire-usda-naip-2023-tom-street-${{ github.sha }}
          path: |
            11_HYDROLOGY_AND_HAZARD/SRC_PUBLIC_GIS_2026-10-16/USDA_NAIP_2023/
            !**/.evidence_vault/**
            !**/SYSTEM_RAW/**
            !**/*_project.html
            !**/*_record_page.html
            !**/*.env
          retention-days: 7
          if-no-files-found: warn
